name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Linux GCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
          sudo modprobe uinput || true
          sudo chmod 0666 /dev/uinput || true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build targets
        run: cmake --build build -j$(nproc)

      - name: Run unit and integration tests
        run: ctest --test-dir build --output-on-failure

      - name: Test TFF CLI commands
        run: |
          ./build/tff_linux --help
          ./build/tff_linux --list
          ./build/tff_linux validate config/tff-combos.yaml

      - name: Test installer script (system-wide)
        run: |
          sudo ./install.sh
          which tff
          tff --help
          tff validate /etc/tff/tff-combos.yaml
          systemctl is-active ten-flying-fingers || true
