name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-check:
    name: Code Formatting (clang-format)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check C/C++ code formatting
        run: |
          find src include tests -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -print0 | xargs -0 clang-format --dry-run --Werror

  build-and-test:
    name: Build & Test (${{ matrix.compiler-name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler-name: 'Linux GCC'
            cc: gcc
            cxx: g++
          - compiler-name: 'Linux Clang'
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup system dependencies
        run: |
          sudo modprobe uinput || true
          sudo chmod 0666 /dev/uinput || true

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTFF_WARNINGS_AS_ERRORS=ON

      - name: Build targets
        run: cmake --build build -j$(nproc)

      - name: Run unit and integration tests
        run: ctest --test-dir build --output-on-failure

      - name: Test TFF CLI commands
        run: |
          ./build/tff_linux --help
          ./build/tff_linux --version
          ./build/tff_linux -V
          ./build/tff_linux --list || true
          ./build/tff_linux validate config/tff-combos.yaml
          ./build/tff_linux setup-udev --print
          ./build/tff_linux setup-udev --check || true

      - name: Test installer script (system-wide)
        run: |
          sudo ./install.sh
          which tff
          tff --help
          tff --version
          tff validate /etc/tff/tff-combos.yaml
          systemd-analyze verify /etc/systemd/system/ten-flying-fingers.service || true
          ls -la /usr/share/bash-completion/completions/tff
          ls -la /usr/share/zsh/site-functions/_tff
          ls -la /usr/share/fish/vendor_completions.d/tff.fish
          ls -la /usr/share/fish/vendor_completions.d/tff2.fish
          ls -la /usr/share/fish/vendor_completions.d/tff_linux.fish

      - name: Test release packaging & static linking
        if: matrix.cc == 'gcc'
        run: |
          bash scripts/package_release.sh "ci-test" "build-static-test" "dist-test"
          tar -tzvf dist-test/tff2_Linux_x86_64.tar.gz
          tar -tzvf dist-test/tff2_Linux_x86_64.tar.gz | grep -E "completions/bash/tff"
          ./dist-test/stage_linux_x86_64/tff --help
          ./dist-test/stage_linux_x86_64/tff --list || true
          ./dist-test/stage_linux_x86_64/tff2 --help
          ./dist-test/stage_linux_x86_64/tff_linux --help

      - name: Test Debian (.deb) package installation & integrity
        if: matrix.cc == 'gcc'
        run: |
          dpkg-deb -I dist-test/tff2_*.deb
          dpkg-deb -c dist-test/tff2_*.deb
          sudo dpkg -i dist-test/tff2_*.deb
          which tff
          which tff2
          which tff_linux
          tff --version
          tff validate /etc/tff/tff-combos.yaml
          systemd-analyze verify /lib/systemd/system/ten-flying-fingers.service || true
          systemd-analyze verify /usr/lib/systemd/user/ten-flying-fingers.service || true
          test -f /lib/udev/rules.d/99-tff.rules
          test -f /usr/share/bash-completion/completions/tff
          test -L /usr/share/bash-completion/completions/tff2
          test -f /usr/share/zsh/site-functions/_tff
          test -f /usr/share/fish/vendor_completions.d/tff.fish
          test -f /usr/share/man/man1/tff.1.gz
          sudo dpkg -P tff2
          ! which tff 2>/dev/null || false


  coverage:
    name: Code Coverage (gcov)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup system dependencies
        run: |
          sudo modprobe uinput || true
          sudo chmod 0666 /dev/uinput || true

      - name: Run code coverage analysis
        run: bash scripts/coverage.sh

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: 'detect_leaks=1:abort_on_error=1:fast_unwind_on_fatal=0'
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup system dependencies
        run: |
          sudo modprobe uinput || true
          sudo chmod 0666 /dev/uinput || true

      - name: Configure CMake with Sanitizers
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON

      - name: Build targets
        run: cmake --build build-asan -j$(nproc)

      - name: Run test suite under ASan & UBSan
        run: ctest --test-dir build-asan --output-on-failure

      - name: Test TFF CLI commands under ASan & UBSan
        run: |
          ./build-asan/tff_linux --help
          ./build-asan/tff_linux --list
          ./build-asan/tff_linux validate config/tff-combos.yaml
          ./build-asan/tff_linux setup-udev --print
          ./build-asan/tff_linux setup-udev --check || true

  cppcheck:
    name: Static Analysis (Cppcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Configure CMake
        run: cmake -B build-cppcheck -DCMAKE_BUILD_TYPE=Release

      - name: Run Cppcheck static analysis
        run: cmake --build build-cppcheck --target cppcheck

  rp2040-firmware:
    name: RP2040 Firmware Cross-Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.1
          submodules: false
          path: pico-sdk

      - name: Initialize Pico SDK TinyUSB submodule
        run: |
          cd pico-sdk
          git submodule update --init --depth 1 lib/tinyusb

      - name: Configure CMake for RP2040
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -B build-rp2040 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BUILD=ON \
            -DPICO_BOARD=adafruit_feather_rp2040

      - name: Build RP2040 Firmware
        run: cmake --build build-rp2040 -j$(nproc)

      - name: Verify firmware binaries
        run: |
          ls -la build-rp2040/tff_rp2040.uf2
          ls -la build-rp2040/tff_rp2040.elf

      - name: Upload RP2040 firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tff_rp2040_firmware
          path: |
            build-rp2040/tff_rp2040.uf2
            build-rp2040/tff_rp2040.elf
          if-no-files-found: error

