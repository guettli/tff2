name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Linux GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup system dependencies
        run: |
          sudo modprobe uinput || true
          sudo chmod 0666 /dev/uinput || true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build targets
        run: cmake --build build -j$(nproc)

      - name: Run unit and integration tests
        run: ctest --test-dir build --output-on-failure

      - name: Test TFF CLI commands
        run: |
          ./build/tff_linux --help
          ./build/tff_linux --list
          ./build/tff_linux validate config/tff-combos.yaml

      - name: Test installer script (system-wide)
        run: |
          sudo ./install.sh
          which tff
          tff --help
          tff validate /etc/tff/tff-combos.yaml
          systemd-analyze verify /etc/systemd/system/ten-flying-fingers.service || true

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: 'detect_leaks=1:abort_on_error=1:fast_unwind_on_fatal=0'
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup system dependencies
        run: |
          sudo modprobe uinput || true
          sudo chmod 0666 /dev/uinput || true

      - name: Configure CMake with Sanitizers
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON

      - name: Build targets
        run: cmake --build build-asan -j$(nproc)

      - name: Run test suite under ASan & UBSan
        run: ctest --test-dir build-asan --output-on-failure

      - name: Test TFF CLI commands under ASan & UBSan
        run: |
          ./build-asan/tff_linux --help
          ./build-asan/tff_linux --list
          ./build-asan/tff_linux validate config/tff-combos.yaml

  cppcheck:
    name: Static Analysis (Cppcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run Cppcheck static analysis
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=checkersReport \
            --suppress=unusedFunction \
            --suppress=useStlAlgorithm \
            --suppress=knownConditionTrueFalse \
            --suppress=normalCheckLevelMaxBranches \
            --suppress='unusedPrivateFunction:*rp2040_platform.h' \
            --error-exitcode=1 \
            --std=c++17 \
            -I include \
            src/ tests/

