name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-check:
    name: Code Formatting (clang-format)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check C/C++ code formatting
        run: |
          find src include tests -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) -print0 | xargs -0 clang-format --dry-run --Werror

  build-and-test:
    name: Build & Test (${{ matrix.compiler-name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler-name: 'Linux GCC'
            cc: gcc
            cxx: g++
          - compiler-name: 'Linux Clang'
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup system dependencies
        run: |
          sudo modprobe uinput || true
          sudo chmod 0666 /dev/uinput || true

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTFF_WARNINGS_AS_ERRORS=ON

      - name: Build targets
        run: cmake --build build -j$(nproc)

      - name: Run unit and integration tests
        run: ctest --test-dir build --output-on-failure

      - name: Test TFF CLI commands
        run: |
          ./build/tff_linux --help
          ./build/tff_linux --version
          ./build/tff_linux -V
          ./build/tff_linux --list || true
          ./build/tff_linux validate config/tff-combos.yaml
          ./build/tff_linux setup-udev --print
          ./build/tff_linux setup-udev --check || true

      - name: Test installer script (system-wide)
        run: |
          sudo ./install.sh
          which tff
          tff --help
          tff --version
          tff validate /etc/tff/tff-combos.yaml
          systemd-analyze verify /etc/systemd/system/ten-flying-fingers.service || true
          ls -la /usr/share/bash-completion/completions/tff
          ls -la /usr/share/zsh/site-functions/_tff
          ls -la /usr/share/fish/vendor_completions.d/tff.fish
          ls -la /usr/share/fish/vendor_completions.d/tff2.fish
          ls -la /usr/share/fish/vendor_completions.d/tff_linux.fish
          # Clean up installed files so subsequent deb package tests are isolated
          sudo rm -f /usr/local/bin/tff /usr/local/bin/tff2 /usr/local/bin/tff_linux
          sudo systemctl stop ten-flying-fingers.service || true

      - name: Test release packaging & static linking
        if: matrix.cc == 'gcc'
        run: |
          bash scripts/package_release.sh "2.0.0-ci" "build-static-test" "dist-test"
          tar -tzvf dist-test/tff2_Linux_x86_64.tar.gz
          tar -tzvf dist-test/tff2_Linux_x86_64.tar.gz | grep -E "completions/bash/tff"
          ./dist-test/stage_linux_x86_64/tff --help
          ./dist-test/stage_linux_x86_64/tff --list || true
          ./dist-test/stage_linux_x86_64/tff2 --help
          ./dist-test/stage_linux_x86_64/tff_linux --help

      - name: Test Debian (.deb) package installation & integrity
        if: matrix.cc == 'gcc'
        run: |
          dpkg-deb -I dist-test/tff2_amd64.deb
          dpkg-deb -c dist-test/tff2_amd64.deb
          sudo dpkg -i dist-test/tff2_amd64.deb
          which tff
          which tff2
          which tff_linux
          tff --version
          tff validate /etc/tff/tff-combos.yaml
          systemd-analyze verify /lib/systemd/system/ten-flying-fingers.service || true
          systemd-analyze verify /usr/lib/systemd/user/ten-flying-fingers.service || true
          test -f /lib/udev/rules.d/99-tff.rules || test -f /usr/lib/udev/rules.d/99-tff.rules
          test -f /usr/share/bash-completion/completions/tff
          test -L /usr/share/bash-completion/completions/tff2
          test -f /usr/share/zsh/site-functions/_tff
          test -f /usr/share/fish/vendor_completions.d/tff.fish
          test -f /usr/share/man/man1/tff.1.gz
          sudo dpkg -P tff2
          ! test -e /usr/bin/tff
          ! test -e /usr/bin/tff2
          ! test -e /usr/bin/tff_linux


  build-windows:
    name: Build & Test (Windows MSVC)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64 -DTFF_WARNINGS_AS_ERRORS=ON

      - name: Build targets
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure -E test_windows_e2e

      - name: Check executables need no Visual C++ Redistributable
        shell: pwsh
        run: |
          # A clean Windows has no VCRUNTIME140.dll / MSVCP140.dll: the CRT must be static.
          $bad = Select-String -Path build/Release/tff.exe, build/Release/tffw.exe `
            -Pattern 'VCRUNTIME\d+(_\d)?\.dll|MSVCP\d+\.dll' -Encoding ascii
          if ($bad) {
            $bad | ForEach-Object { Write-Output "::error::$($_.Path) imports $($_.Matches[0].Value)" }
            exit 1
          }

      - name: Test TFF CLI commands
        shell: pwsh
        run: |
          $tff = "build/Release/tff.exe"
          function Check([int]$expected) {
            if ($LASTEXITCODE -ne $expected) {
              Write-Output "::error::exit code $LASTEXITCODE, expected $expected"
              exit 1
            }
          }
          & $tff --help; Check 0
          & $tff --version; Check 0
          & $tff -V; Check 0
          & $tff validate config/tff-combos.yaml; Check 0
          & $tff validate tests/windows/e2e.yaml; Check 0
          & $tff cheatsheet --plain config/tff-combos.yaml; Check 0
          & $tff cheatsheet --markdown config/tff-combos.yaml; Check 0
          & $tff init --list-presets; Check 0
          & $tff init --preset minimal --print; Check 0
          & $tff list; Check 0
          & $tff autostart status; Check 0
          & $tff --grab 2>$null; Check 2
          & $tff setup-udev 2>$null; Check 2
          & $tff validate does-not-exist.yaml 2>$null; Check 1
          # Non-ASCII path (UTF-8 active code page)
          New-Item -ItemType Directory -Force "$env:TEMP/tff-ü" | Out-Null
          Copy-Item config/tff-combos.yaml "$env:TEMP/tff-ü/kömbos.yaml"
          & $tff validate "$env:TEMP/tff-ü/kömbos.yaml"; Check 0
          exit 0

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Package (ZIP + MSI)
        working-directory: build
        run: cpack -C Release -G "ZIP;WIX"

      - name: Test MSI install / uninstall
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/tff2-*-windows-x64.msi | Select-Object -First 1
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v msi.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 60; exit 1 }
          $dir = Join-Path $env:ProgramFiles "TFF2"
          foreach ($f in "tff.exe", "tffw.exe", "tff-combos.yaml") {
            if (-not (Test-Path (Join-Path $dir $f))) {
              Write-Output "::error::$f missing in $dir after MSI install"
              Get-ChildItem -Recurse $dir -ErrorAction SilentlyContinue
              exit 1
            }
          }
          & (Join-Path $dir "tff.exe") --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & (Join-Path $dir "tff.exe") validate (Join-Path $dir "tff-combos.yaml")
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (Test-Path (Join-Path $dir "tff.exe")) { Write-Output "::error::uninstall left tff.exe"; exit 1 }
          exit 0

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: tff2-windows-x64
          path: |
            build/tff2-*-windows-x64.zip
            build/tff2-*-windows-x64.msi
          if-no-files-found: error


  windows-e2e:
    # Drives the real keyboard input stack of the runner: tff.exe with its low-level hook,
    # keys typed with SendInput, remapped output checked by a second hook.
    name: Windows End-to-End (real hook + SendInput)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build tff.exe and tff_e2e.exe
        run: |
          cmake -B build -A x64 -DTFF_WARNINGS_AS_ERRORS=ON
          cmake --build build --config Release --parallel --target tff tff_e2e

      - name: Hook calibration (no tff.exe)
        shell: pwsh
        timeout-minutes: 2
        run: |
          & build/Release/tff_e2e.exe --calibrate-only
          exit $LASTEXITCODE

      - name: End-to-end test
        shell: pwsh
        timeout-minutes: 4
        run: |
          & build/Release/tff_e2e.exe build/Release/tff.exe tests/windows/e2e.yaml
          exit $LASTEXITCODE

  coverage:
    name: Code Coverage (gcov)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup system dependencies
        run: |
          sudo modprobe uinput || true
          sudo chmod 0666 /dev/uinput || true

      - name: Run code coverage analysis
        run: bash scripts/coverage.sh

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: 'detect_leaks=1:abort_on_error=1:fast_unwind_on_fatal=0'
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup system dependencies
        run: |
          sudo modprobe uinput || true
          sudo chmod 0666 /dev/uinput || true

      - name: Configure CMake with Sanitizers
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON

      - name: Build targets
        run: cmake --build build-asan -j$(nproc)

      - name: Run test suite under ASan & UBSan
        run: ctest --test-dir build-asan --output-on-failure

      - name: Test TFF CLI commands under ASan & UBSan
        run: |
          ./build-asan/tff_linux --help
          ./build-asan/tff_linux --list
          ./build-asan/tff_linux validate config/tff-combos.yaml
          ./build-asan/tff_linux setup-udev --print
          ./build-asan/tff_linux setup-udev --check || true

  cppcheck:
    name: Static Analysis (Cppcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Configure CMake
        run: cmake -B build-cppcheck -DCMAKE_BUILD_TYPE=Release

      - name: Run Cppcheck static analysis
        run: cmake --build build-cppcheck --target cppcheck

  rp2040-firmware:
    name: RP2040 Firmware Cross-Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Cache Pico SDK
        id: cache-pico-sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-2.1.1-tinyusb

      - name: Checkout Pico SDK
        if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.1
          submodules: false
          path: pico-sdk

      - name: Initialize Pico SDK TinyUSB submodule
        if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
        run: |
          cd pico-sdk
          git submodule update --init --depth 1 lib/tinyusb

      - name: Build RP2040 Firmware via scripts/build_rp2040.sh
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          PICO_BOARD: adafruit_feather_rp2040
        run: |
          bash scripts/build_rp2040.sh build-rp2040

      - name: Verify UF2 binary structure & magic header
        run: |
          test -s build-rp2040/tff_rp2040.uf2
          test -s build-rp2040/tff_rp2040.elf
          python3 -c "
          import struct
          with open('build-rp2040/tff_rp2040.uf2', 'rb') as f:
              data = f.read()
          assert len(data) >= 512, f'UF2 file too small: {len(data)} bytes'
          assert len(data) % 512 == 0, f'UF2 file size not a multiple of 512: {len(data)} bytes'
          magic1, magic2 = struct.unpack('<II', data[:8])
          assert magic1 == 0x0A324655, f'Invalid UF2 magic start: {hex(magic1)}'
          assert magic2 == 0x9E5D5157, f'Invalid second magic: {hex(magic2)}'
          end_magic = struct.unpack('<I', data[508:512])[0]
          assert end_magic == 0x0AB16F30, f'Invalid block end magic: {hex(end_magic)}'
          print(f'UF2 binary verified ({len(data)} bytes, {len(data)//512} blocks): magics {hex(magic1)}, {hex(magic2)}, {hex(end_magic)} valid!')
          "

      - name: Upload RP2040 firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tff_rp2040_firmware
          path: |
            build-rp2040/tff_rp2040.uf2
            build-rp2040/tff_rp2040.elf
          if-no-files-found: error

