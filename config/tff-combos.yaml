# Ten Flying Fingers (TFF) is a keyboard layout.
# It is optimized for keeping your fingers on the home row.
# https://github.com/guettli/tff

combos:
  # When I select parts with the trackpoint, the right index moves from J
  # to the trackpoint. The middle and ring finger loose their home position, too.
  # The right pinky is the only finger which stays on the home row.
  # "semicolon" (ö on German keyboards) is below the right pinky finger.

  # Backspace:
  # I use that key often, because I do typos often. I want a "strong" finger for that.
  # Not the pinky finger. It should be similar to "Pos1"
  - keys: j f
    outKeys: backspace

  # Delete:
  # Like backspace, but in the other direction.
  - keys: f j
    outKeys: delete


  # Home (pos1, start of line)
  # "a" is on the left side, that's where Home should move to.
  - keys: semicolon a
    outKeys: home

  # End (end of line)
  # semicolon is at the right side.
  - keys: a semicolon
    outKeys: end

  # Down:
  # Selecting items from an autocomplete list (e.g. in a browser address bar).
  - keys: f n
    outKeys: down

  - keys: f u
    outKeys: up

  - keys: f m
    outKeys: down

  - keys: f k
    outKeys: left

  - keys: f l
    outKeys: right

  - keys: f i
    outKeys: pageup

  - keys: f comma
    outKeys: pagedown

  - keys: g h
    outKeys: esc

  # Triple combo: press d, f, and j together to emit Escape
  d + f + j: esc

# Tap vs Hold (Dual-role keys):
# Short tap on CapsLock emits Escape.
# Long press or chord with another key emits Super (Windows key).
tap_hold:
  capslock:
    tap: esc
    hold: super
    timeout_ms: 200

# Modal Keyboard Layers:
# Hold a key to temporarily switch into a dedicated navigation or numeric layer.
# Unmapped keys pass through to base typing.
#
# layers:
#   nav:
#     h: left
#     j: down
#     k: up
#     l: right
#     w: ctrl+right
#     b: ctrl+left
#     d: delete
#   numpad:
#     m: 0
#     j: 1
#     k: 2
#     l: 3
#     u: 4
#     i: 5
#     o: 6
#
# tap_hold:
#   space:
#     tap: space
#     layer: nav
#     timeout_ms: 200

# One-Shot / Sticky Modifiers and Layers (OSM & OSL):
# Quick tap arms the modifier or layer for the next single keypress, then auto-disengages.
# Holding or chording the key acts as a regular sustained modifier or momentary layer.
#
# one_shot:
#   leftshift: 1500    # Tap Shift -> next key is capitalized, expires in 1.5s
#   leftctrl: 1500     # Tap Ctrl -> next key has Ctrl modifier (e.g. tap Ctrl, press C -> Ctrl+C)
#   space: [nav, 1500] # Tap Space -> next single key comes from 'nav' layer
#
# Tap-Hold can also arm one-shot actions:
# tap_hold:
#   capslock: [osm(shift), super, 200]  # Tap = Sticky Shift, Hold = Super
#   space: [osl(nav), alt, 200]         # Tap = One-Shot Nav layer, Hold = Alt

# Sequential Leader Key Sequences (Mnemonic Shortcuts):
# Tap leader key, then type mnemonic keys sequentially (Vim/Emacs style).
# Buffered keys are automatically replayed on typo/mismatch or timeout!
#
# leader:
#   key: capslock
#   timeout_ms: 1000
#   sequences:
#     "w q": ":wq\n"
#     "g s": "git status\n"
#     "b": ctrl+b