# Ten Flying Fingers (TFF) is a keyboard layout.
# It is optimized for keeping your fingers on the home row.
# https://github.com/guettli/tff

combos:
  # When I select parts with the trackpoint, the right index moves from J
  # to the trackpoint. The middle and ring finger loose their home position, too.
  # The right pinky is the only finger which stays on the home row.
  # "semicolon" (ö on German keyboards) is below the right pinky finger.

  # Backspace:
  # I use that key often, because I do typos often. I want a "strong" finger for that.
  # Not the pinky finger. It should be similar to "Pos1"
  - keys: j f
    outKeys: backspace

  # Delete:
  # Like backspace, but in the other direction.
  - keys: f j
    outKeys: delete


  # Home (pos1, start of line)
  # "a" is on the left side, that's where Home should move to.
  - keys: semicolon a
    outKeys: home

  # End (end of line)
  # semicolon is at the right side.
  - keys: a semicolon
    outKeys: end

  # Down:
  # Selecting items from an autocomplete list (e.g. in a browser address bar).
  - keys: f n
    outKeys: down

  - keys: f u
    outKeys: up

  - keys: f m
    outKeys: down

  - keys: f k
    outKeys: left

  - keys: f l
    outKeys: right

  - keys: f i
    outKeys: pageup

  - keys: f comma
    outKeys: pagedown

  - keys: g h
    outKeys: esc

  # Triple combo: press d, f, and j together to emit Escape
  d + f + j: esc

# Tap vs Hold (Dual-role keys):
# Short tap on CapsLock emits Escape.
# Long press or chord with another key emits Super (Windows key).
tap_hold:
  capslock:
    tap: esc
    hold: super
    timeout_ms: 200

# Modal Keyboard Layers:
# Hold a key to temporarily switch into a dedicated navigation or numeric layer.
# Unmapped keys pass through to base typing.
#
# layers:
#   nav:
#     h: left
#     j: down
#     k: up
#     l: right
#     w: ctrl+right
#     b: ctrl+left
#     d: delete
#   numpad:
#     m: 0
#     j: 1
#     k: 2
#     l: 3
#     u: 4
#     i: 5
#     o: 6
#
# tap_hold:
#   space:
#     tap: space
#     layer: nav
#     timeout_ms: 200

# One-Shot / Sticky Modifiers and Layers (OSM & OSL):
# Quick tap arms the modifier or layer for the next single keypress, then auto-disengages.
# Holding or chording the key acts as a regular sustained modifier or momentary layer.
#
# one_shot:
#   leftshift: 1500    # Tap Shift -> next key is capitalized, expires in 1.5s
#   leftctrl: 1500     # Tap Ctrl -> next key has Ctrl modifier (e.g. tap Ctrl, press C -> Ctrl+C)
#   space: [nav, 1500] # Tap Space -> next single key comes from 'nav' layer
#
# Tap-Hold can also arm one-shot actions:
# tap_hold:
#   capslock: [osm(shift), super, 200]  # Tap = Sticky Shift, Hold = Super
#   space: [osl(nav), alt, 200]         # Tap = One-Shot Nav layer, Hold = Alt

# Tap Dance (Multi-Tap and Tap-Hold Variations on a Single Key):
# Single tap, double tap, hold, double-tap & hold, or triple tap actions on a single key.
#
# tap_dance:
#   capslock:
#     tap: esc
#     double_tap: capslock
#     hold: lctrl
#     double_hold: rctrl
#     triple_tap: text "DONE"
#     timeout_ms: 220
#   tab: { tap: tab, double_tap: tg(nav) }

# Sequential Leader Key Sequences (Mnemonic Shortcuts):
# Tap leader key, then type mnemonic keys sequentially (Vim/Emacs style).
# Buffered keys are automatically replayed on typo/mismatch or timeout!
#
# leader:
#   key: capslock
#   timeout_ms: 1000
#   sequences:
#     "w q": ":wq\n"
#     "g s": "git status\n"
#     "b": ctrl+b
#     "n p": toggle_layer(numpad)  # Mnemonic shortcut to toggle numpad layer on/off

# Toggle / Locking Layers (tg / toggle_layer):
# Persistently lock a layer on without holding any keys.
# Useful for dedicated numpad data entry, gaming, or symbol layers.
#
# combos:
#   f + space: toggle_layer(numpad)  # Combo to toggle numpad on/off
#
# tap_hold:
#   capslock: [toggle_layer(numpad), super, 200]  # Tap = Toggle Numpad, Hold = Super
#
# layers:
#   numpad:
#     esc: toggle_layer(numpad)      # Pressing Escape exits numpad mode
#     m: 0
#     j: 1
#     k: 2
#     l: 3

# Auto-Shift (Long-Press Key Capitalization):
# Tap a key (< timeout_ms) to type lowercase character/symbol.
# Hold a key (>= timeout_ms) to automatically emit shifted uppercase/symbol.
# Typing fast immediately commits unshifted keys without any delay (no delay during fast typing!).
# Physical or sticky modifiers (Ctrl, Alt, Super) automatically bypass Auto-Shift for zero-delay hotkeys.
#
# auto_shift:
#   enabled: true
#   timeout_ms: 175
#   keys: letters   # letters (default), numbers, symbols, all, or explicit list like [a, b, c, comma]

# Home-Row Mouse Keys via uinput:
# Full mouse cursor movement, scroll wheel, and click-and-drag emulation via Linux uinput.
# Relative motion is emitted natively (EV_REL: REL_X, REL_Y, REL_WHEEL, REL_HWHEEL)
# and mouse buttons are standard Linux keys (BTN_LEFT, BTN_RIGHT, BTN_MIDDLE, BTN_SIDE, BTN_EXTRA).
#
# mouse:
#   speed: 12        # Cursor move speed in pixels (default: 10)
#   wheel_step: 1    # Scroll wheel units per event (default: 1)
#
# tap_hold:
#   space:
#     tap: space
#     layer: mouse
#     timeout_ms: 180
#
# layers:
#   mouse:
#     h: mouse_left
#     j: mouse_down
#     k: mouse_up
#     l: mouse_right
#     u: wheel_up
#     d: wheel_down
#     f: mouse_btn_left    # Hold to drag!
#     s: mouse_btn_right

# Global Engine & Platform Settings:
# Customize chord detection timing, default tap-vs-hold timeout, exclusive grab, and hotplug.
#
# settings:
#   combo_timeout_ms: 40       # Overlap detection window in ms (default: 40)
#   tap_hold_timeout_ms: 200   # Default timeout for dual-role keys in ms (default: 200)
#   exclusive_grab: true       # Exclusively grab physical keyboards (default: true)
#   hotplug: true              # Inotify device hotplugging (default: true)